[package]
name = "gtaurus_server"
version = "0.1.0"
edition = "2021"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serialport = "4.8.1"
tungstenite = { version = "0.26", features = ["native-tls"] }
tokio = { version = "1.49", features = ["full"] }
reqwest = { version = "0.12", features = ["json", "multipart", "blocking"] }
tokio-tungstenite = "0.26"
futures-util = "0.3"
warp = "0.3"
